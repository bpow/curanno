<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>PDF</title>
  </head>
  <body>
    <header id="toolbar" class="toolbar" data-annotatable="false">
      <span id="title" class="title">PDF</span>
      <span class="pages">
        <label
          >Page <input id="page" type="number" min="1" value="1" aria-label="Page number"
        /></label>
        <span aria-hidden="true">/</span>
        <span id="page-count" aria-label="Page count">–</span>
      </span>
      <span class="zoom">
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <select id="zoom" aria-label="Zoom">
          <option value="auto">Automatic</option>
          <option value="page-width">Page width</option>
          <option value="page-fit">Page fit</option>
          <option value="1">100%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
        </select>
      </span>
      <button id="toggle-sidebar" type="button">Annotations</button>
    </header>
    <section id="open" class="open" hidden data-annotatable="false">
      <h1>Open a PDF</h1>
      <p class="muted">
        Annotations on a PDF follow the file, not where it came from: the same file opened from a
        URL or from your computer shows the same annotations.
      </p>
      <form id="open-url" class="row">
        <label for="url">URL of a PDF</label>
        <input
          id="url"
          name="url"
          type="url"
          required
          placeholder="https://example.org/paper.pdf"
        />
        <button type="submit">Open</button>
      </form>
      <p class="row">
        <label for="file">Or a file from your computer</label>
        <input id="file" name="file" type="file" accept="application/pdf,.pdf" />
      </p>
      <p id="open-error" class="error" role="alert" hidden></p>
    </section>
    <div id="viewerContainer" class="viewerContainer" tabindex="0">
      <div id="viewer" class="pdfViewer"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
