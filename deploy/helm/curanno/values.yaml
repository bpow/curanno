# Default values for the curanno chart. Point `secrets.databaseUrl` or
# `existingSecret` at a database provided by the cluster or a managed service,
# or, for small and trial installs, enable the single-replica `postgres` below.
#
# Two deployments (ADR 0021): the API, which also serves the sidebar, the PDF
# viewer and the guest bundle from its image, and the management site. One
# ingress host carries them all: /annotations, /x, /sidebar, /pdf, /guest.js
# and /metrics go to the API, everything else to the site. The PDF viewer is
# served on a second host of its own, so a PDF.js bug never runs on the
# sidebar's origin.

replicaCount: 2

image:
  repository: ghcr.io/bpow/curanno-api
  tag: '' # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

# Non-secret environment variables (see .env.example at the repository root).
config:
  # Issuer IRI of the OpenID Connect provider; discovery runs at
  # <issuer>/.well-known/openid-configuration (ADR 0005).
  oidcIssuer: https://idp.example
  # The public client the sidebar and the site authenticate as. Required unless
  # zitadel.provision is enabled, which creates the client and supplies its id.
  oidcClientId: ''
  # Accepted `aud` claim. Defaults to the client id when empty.
  oidcAudience: ''
  # Origin under which annotation IRIs are minted: the ingress host, with its scheme.
  publicUrl: https://curanno.example
  logLevel: info
  # Origins allowed to embed the sidebar, as Content-Security-Policy source
  # expressions (space-separated). The PDF viewer's origin is added automatically.
  frameAncestors: "'self'"
  # Prometheus metrics at /metrics on the API. Keep them off the ingress
  # (see ingress.metrics below) or turn them off.
  metricsEnabled: true

# Browser extensions the sidebar may sign in through, on pages that cut off
# its sign-in popup (ADR 0029). Registered as https://<id>.chromiumapp.org/
# with the embedded issuer, or by zitadel.provision; with another provider,
# register that address yourself. apps/extension's id is
# dmlkjhnoiinndnkboiknehimngilddpp.
extensionIds: []

# Who issues the tokens. `external` (the default) trusts the OpenID Connect
# provider named in `config.oidcIssuer` (ADR 0005; Zitadel can be provisioned
# below). `embedded` makes the API its own issuer on `config.publicUrl`
# (ADR 0028): then only Postgres is needed, `config.oidcIssuer`,
# `config.oidcClientId` and `zitadel.provision` are not used, and
# `secrets.authSecret` is required. See docs/operator-guide.md.
auth:
  mode: external
  # Who may create an account by themselves: approval (they wait for an
  # administrator), open, or closed (invitations only, always possible).
  signup: approval
  # Under approval, applicants with a verified address in these domains are approved at once.
  autoApproveDomains: []
  # Providers whose verified email may join an existing account without its
  # password (google, github, oidc). Leave empty unless you trust them.
  autolink: []
  # Sign-up pauses while this many applications wait.
  maxPending: 200
  # While no administrator exists, this address is invited to become one.
  bootstrapAdminEmail: ''
  # Origins besides config.publicUrl where the sidebar or site run (redirect URIs).
  extraOrigins: []
  # Mail for invitations, resets and verification; set `from` and
  # `secrets.smtpUrl`. Without them nothing is sent: administrators hand out
  # invitation links (`account invite`) and password reset is off.
  mail:
    from: ''
  # Sign in with another service. Set the client id here and its secret under
  # `secrets.upstream`. The redirect URI to register is
  # <config.publicUrl>/idp/upstream/<google|github|oidc>/callback.
  providers:
    google:
      clientId: ''
    github:
      clientId: ''
    oidc:
      issuer: ''
      clientId: ''
      name: ''

# The database URL is a secret. Either set it here (rendered into a Secret
# managed by the chart) or name an existing Secret holding DATABASE_URL.
secrets:
  databaseUrl: ''
  existingSecret: ''
  databaseUrlKey: DATABASE_URL
  # Embedded mode. At least 32 random characters, the same on every replica
  # and kept across upgrades: it seals the signing keys in the database and
  # keys the cookies (`openssl rand -base64 48`). With `existingSecret`, hold
  # these under the keys AUTH_SECRET, SMTP_URL and UPSTREAM_<GOOGLE|GITHUB|OIDC>_CLIENT_SECRET.
  authSecret: ''
  # smtp://user:password@host:587 or smtps://...
  smtpUrl: ''
  upstream:
    googleClientSecret: ''
    githubClientSecret: ''
    oidcClientSecret: ''

# With Zitadel as the provider (deploy/zitadel/README.md): a hook Job runs
# deploy/zitadel/provision.ts from the API image before every install and
# upgrade. It creates or updates the client for config.publicUrl at
# config.oidcIssuer and writes the generated id to the ConfigMap
# <fullname>-oidc, which the API and the site read instead of
# config.oidcClientId. Zitadel must already be running, and the Secret below
# must hold a token of an account with the IAM_OWNER role (the Zitadel chart
# stores one as iam-admin-pat).
zitadel:
  provision:
    enabled: false
    tokenSecret:
      name: iam-admin-pat
      key: pat
    # Origins besides config.publicUrl to register redirect URIs for.
    extraOrigins: []

# A single Postgres pod with a volume of its own: no replication or failover,
# so back it up (docs/operator-guide.md). The API's DATABASE_URL is built from
# these values; leave `secrets.databaseUrl` empty.
postgres:
  enabled: false
  image:
    # The Debian variant: its entrypoint runs under an arbitrary uid (OpenShift).
    repository: docker.io/library/postgres
    tag: '17'
    pullPolicy: IfNotPresent
  database: curanno
  username: curanno
  # Required unless `secrets.existingSecret` holds POSTGRES_PASSWORD. Letters,
  # digits and . _ ~ - only, since it goes into DATABASE_URL. Applied only when
  # the volume is first initialized; changing it later does not change the database's.
  password: ''
  persistence:
    size: 1Gi
    storageClass: '' # the cluster's default when empty
    accessModes: [ReadWriteOnce]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # No user, for OpenShift's restricted SCC as above. Elsewhere the image's
  # default user is root, which runAsNonRoot refuses: add runAsUser: 999 and fsGroup: 999.
  podSecurityContext:
    runAsNonRoot: true

# Migrations run from an init container with the same image before each pod
# starts; the runner takes an advisory lock so replicas starting together are safe.
migrations:
  enabled: true

# The PDF viewer, served by the API image for this host name only (ADR 0021).
# Needs a DNS name and a certificate of its own; empty serves no viewer.
pdfViewer:
  host: pdf.curanno.example

# The management site (apps/web), a Nitro server from the `web` image target.
web:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/bpow/curanno-web
    tag: '' # defaults to the chart's appVersion
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ''
  # Server-sent events are long-lived responses. Most ingress controllers
  # close idle upstream connections after 60 s and buffer responses; raise
  # the read timeout and turn buffering off. The annotations below are for
  # ingress-nginx; see templates/NOTES.txt for others.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-http-version: '1.1'
  # The main host: `config.publicUrl` without the scheme.
  host: curanno.example
  # Whether /metrics is reachable through the ingress. Off by default: scrape
  # the API Service inside the cluster instead (port http, path /metrics).
  metrics: false
  tls: []

# OpenShift Routes instead of an Ingress (not both): one Route per path, since
# a Route has a single path, with TLS terminated at the router. Without
# `tls.certificate`/`tls.key` the router's default certificate is used, which
# covers hosts under the cluster's apps domain.
route:
  enabled: false
  # The main host. Defaults to the host of config.publicUrl.
  host: ''
  annotations:
    # Server-sent events: the router's default server timeout is 30 s.
    haproxy.router.openshift.io/timeout: 1h
    # The API takes the client's address from X-Forwarded-For for its sign-in
    # and sign-up limits; the router appends to a client's own header by default.
    haproxy.router.openshift.io/set-forwarded-headers: replace
  # Whether /metrics is reachable through the router (see ingress.metrics).
  metrics: false
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Liveness only says the process answers; readiness also checks the database,
# so a database outage takes pods out of the Service without restarting them.
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10

podAnnotations: {}
# No user or fsGroup: the images run as 1000:0 by default, and OpenShift's
# restricted SCC substitutes a uid from the namespace's range (gid 0), which
# a fixed runAsUser would make it refuse.
podSecurityContext:
  runAsNonRoot: true
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
