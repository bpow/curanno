{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "curanno.fullname" . }}
  labels:
    {{- include "curanno.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.databaseUrlKey }}: {{ required "secrets.databaseUrl or secrets.existingSecret is required" .Values.secrets.databaseUrl | quote }}
  {{- if include "curanno.embedded" . }}
  AUTH_SECRET: {{ .Values.secrets.authSecret | quote }}
  {{- with .Values.secrets.smtpUrl }}
  SMTP_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.upstream.googleClientSecret }}
  UPSTREAM_GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.upstream.githubClientSecret }}
  UPSTREAM_GITHUB_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.upstream.oidcClientSecret }}
  UPSTREAM_OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
