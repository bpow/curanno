{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "curanno.fullname" . }}
  labels:
    {{- include "curanno.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.databaseUrlKey }}: {{ required "secrets.databaseUrl or secrets.existingSecret is required" .Values.secrets.databaseUrl | quote }}
{{- end }}
