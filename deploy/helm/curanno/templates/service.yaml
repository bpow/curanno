apiVersion: v1
kind: Service
metadata:
  name: {{ include "curanno.fullname" . }}
  labels:
    {{- include "curanno.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # The component keeps the web and Job pods, which share curanno.selectorLabels,
  # out. The Deployment's selector stays as it was: it is immutable.
  selector:
    {{- include "curanno.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
