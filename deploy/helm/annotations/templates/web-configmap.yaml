{{- if .Values.web.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "annotations.fullname" . }}-web
  labels:
    {{- include "annotations.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  PORT: '3001'
  HOST: 0.0.0.0
  # The site is an ordinary client of the API on the same origin (ADR 0020).
  NUXT_PUBLIC_API_BASE: ''
  # Also fills in the site's Content-Security-Policy when it starts, so it must be set.
  NUXT_PUBLIC_OIDC_ISSUER: {{ required "config.oidcIssuer is required" .Values.config.oidcIssuer | trimSuffix "/" | quote }}
  {{- if not .Values.zitadel.provision.enabled }}
  NUXT_PUBLIC_OIDC_CLIENT_ID: {{ .Values.config.oidcClientId | quote }}
  {{- end }}
  {{- with .Values.pdfViewer.host }}
  NUXT_PUBLIC_PDF_VIEWER_URL: {{ printf "https://%s/pdf/" . | quote }}
  {{- else }}
  NUXT_PUBLIC_PDF_VIEWER_URL: ''
  {{- end }}
{{- end }}
