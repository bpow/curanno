apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "annotations.fullname" . }}
  labels:
    {{- include "annotations.labels" . | nindent 4 }}
data:
  PORT: '3000'
  OIDC_ISSUER: {{ required "config.oidcIssuer is required" .Values.config.oidcIssuer | quote }}
  OIDC_CLIENT_ID: {{ required "config.oidcClientId is required" .Values.config.oidcClientId | quote }}
  {{- with .Values.config.oidcAudience }}
  OIDC_AUDIENCE: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.oidcAdminGroup }}
  OIDC_ADMIN_GROUP: {{ . | quote }}
  {{- end }}
  PUBLIC_URL: {{ required "config.publicUrl is required" .Values.config.publicUrl | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
