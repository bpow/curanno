# Local development stack. Postgres is the only stateful dependency of the
# platform itself; Zitadel stands in for the external OpenID Connect provider
# (ADR 0005) and keeps its own database in the same Postgres. Run with
# `podman compose up -d --wait` (or docker compose); zitadel-provision then
# creates the client and the development users and writes the client id to
# deploy/zitadel/.bootstrap/oidc.env, which the dev servers fall back to.
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: curanno
      POSTGRES_PASSWORD: curanno
      POSTGRES_DB: curanno
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U curanno -d curanno']
      interval: 5s
      timeout: 3s
      retries: 10

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.20.1
    # Root so the bootstrap tokens can be written to the bind mount.
    user: '0'
    command: start-from-init --masterkey MasterkeyNeedsToHave32Characters
    environment:
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${ZITADEL_PORT:-8080}
      ZITADEL_EXTERNALSECURE: 'false'
      ZITADEL_TLS_ENABLED: 'false'
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: curanno
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: curanno
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_NAME: curanno-dev
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: 'false'
      # IAM_OWNER service account; deploy/zitadel/provision.ts uses its token.
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: provisioner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Provisioner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: '2099-01-01T00:00:00Z'
      # IAM_LOGIN_CLIENT service account for the login UI (and the live OIDC test).
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: '2099-01-01T00:00:00Z'
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: 'true'
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:${ZITADEL_PORT:-8080}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:${ZITADEL_PORT:-8080}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:${ZITADEL_PORT:-8080}/ui/v2/login/logout?post_logout_redirect=
      # The development users' passwords are their usernames.
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_MINLENGTH: 1
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASLOWERCASE: 'false'
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASUPPERCASE: 'false'
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASNUMBER: 'false'
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASSYMBOL: 'false'
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: 'false'
    volumes:
      - ./deploy/zitadel/.bootstrap:/zitadel/bootstrap:Z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/app/zitadel', 'ready']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.20.1
    user: '0'
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: development-only-login-cookie-secret
      CUSTOM_REQUEST_HEADERS: Host:localhost,X-Forwarded-Proto:http
    volumes:
      - ./deploy/zitadel/.bootstrap:/zitadel/bootstrap:ro,Z
    depends_on:
      zitadel:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs', 'http://localhost:3000/ui/v2/login/healthy']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # One origin for the API and the login UI, as an ingress or route gives
  # them in a deployment (deploy/zitadel/values.yaml).
  zitadel-proxy:
    image: docker.io/library/caddy:2.10-alpine
    environment:
      ZITADEL_PORT: ${ZITADEL_PORT:-8080}
    ports:
      - '${ZITADEL_PORT:-8080}:${ZITADEL_PORT:-8080}'
    volumes:
      - ./deploy/zitadel/Caddyfile:/etc/caddy/Caddyfile:ro,Z
    depends_on:
      zitadel-login:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://localhost:${ZITADEL_PORT:-8080}/.well-known/openid-configuration',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Idempotent, so it runs on every `up`. It shares the proxy's network
  # namespace because Zitadel picks the instance by host: the issuer must be
  # reached as localhost:$ZITADEL_PORT here too. It stays up, healthy once done,
  # because `up --wait` fails on a container that exits.
  zitadel-provision:
    image: docker.io/library/node:24-alpine
    network_mode: service:zitadel-proxy
    init: true
    working_dir: /provision
    command:
      - sh
      - -c
      - node provision.ts --issuer http://localhost:${ZITADEL_PORT:-8080} --dev-users --write-env .bootstrap/oidc.env && touch /tmp/done && exec sleep infinity
    volumes:
      - ./deploy/zitadel:/provision:Z
    depends_on:
      zitadel-proxy:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/done']
      interval: 2s
      retries: 30

volumes:
  postgres-data:
