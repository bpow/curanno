name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: annotations
          POSTGRES_PASSWORD: annotations
          POSTGRES_DB: annotations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U annotations -d annotations"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://annotations:annotations@localhost:5432/annotations
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
      - run: pnpm licenses:check
      - run: pnpm openapi:lint
      - run: pnpm api-client:check

  # The anchoring trial and the guest's browser tests need a browser; they run
  # apart from `pnpm check` so a Chromium download never blocks the fast
  # checks. The trial fails on a guessed must-not-match anchor (success
  # criterion 5); its results are uploaded, and the committed report under
  # packages/guest/trial/results is the record, reviewed like code. The
  # browser tests run the text-model fixtures through the guest, the RPC
  # against the fake sidebar, and the hostile-page check (criterion 6).
  guest-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scale/guest exec playwright install --with-deps chromium
      - run: pnpm --filter @scale/guest test:browser
      - run: pnpm --filter @scale/guest trial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-trial-results
          path: packages/guest/trial/results/

  # The sidebar's end-to-end test needs Postgres, Keycloak, the API and the
  # Vite dev server. Keycloak is not a `services:` container because
  # `--import-realm` needs deploy/keycloak/realm-dev.json from the checkout,
  # and service containers start before the checkout exists; it runs as a
  # container started after it instead. Playwright starts the API and Vite.
  sidebar-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: annotations
          POSTGRES_PASSWORD: annotations
          POSTGRES_DB: annotations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U annotations -d annotations"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://annotations:annotations@localhost:5432/annotations
      OIDC_ISSUER: http://localhost:8080/realms/annotations-dev
      OIDC_CLIENT_ID: annotations-sidebar
      PUBLIC_URL: http://localhost:3000
      PORT: 3000
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      - run: >-
          docker run -d --name keycloak -p 8080:8080
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin
          -v "$PWD/deploy/keycloak/realm-dev.json:/opt/keycloak/data/import/realm-dev.json:ro"
          quay.io/keycloak/keycloak:26.4 start-dev --import-realm --http-port=8080
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @scale/api migrate
      - run: pnpm --filter @scale/sidebar exec playwright install --with-deps chromium
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:8080/realms/annotations-dev && exit 0
            sleep 2
          done
          docker logs keycloak
          exit 1
      - run: pnpm --filter @scale/sidebar e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sidebar-e2e-report
          path: |
            apps/sidebar/playwright-report/
            apps/sidebar/test-results/

  # The management site's end-to-end test needs the same stack as the sidebar's.
  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: annotations
          POSTGRES_PASSWORD: annotations
          POSTGRES_DB: annotations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U annotations -d annotations"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://annotations:annotations@localhost:5432/annotations
      OIDC_ISSUER: http://localhost:8080/realms/annotations-dev
      OIDC_CLIENT_ID: annotations-sidebar
      PUBLIC_URL: http://localhost:3000
      PORT: 3000
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      - run: >-
          docker run -d --name keycloak -p 8080:8080
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin
          -v "$PWD/deploy/keycloak/realm-dev.json:/opt/keycloak/data/import/realm-dev.json:ro"
          quay.io/keycloak/keycloak:26.4 start-dev --import-realm --http-port=8080
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @scale/api migrate
      - run: pnpm --filter @scale/web exec playwright install --with-deps chromium
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:8080/realms/annotations-dev && exit 0
            sleep 2
          done
          docker logs keycloak
          exit 1
      - run: pnpm --filter @scale/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/

  # The API image must build and the chart must render without a cluster
  # (plan, Phase 3). Neither job pushes anything.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t annotations-api -f Dockerfile .
      - run: docker run --rm annotations-api node -e "require('node:fs').accessSync('openapi.yaml'); console.log('image ok')"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/annotations --set secrets.databaseUrl=postgres://ci
      - run: helm template ci deploy/helm/annotations --set secrets.databaseUrl=postgres://ci --set ingress.enabled=true > /dev/null
