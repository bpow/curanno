name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: annotations
          POSTGRES_PASSWORD: annotations
          POSTGRES_DB: annotations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U annotations -d annotations"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://annotations:annotations@localhost:5432/annotations
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      # The backup and restore test runs pg_dump and pg_restore from the
      # Postgres container, whose major version matches the server's. These
      # are step-level because job-level env cannot read the `job` context.
      - run: pnpm test
        env:
          PG_DUMP: docker exec -i ${{ job.services.postgres.id }} pg_dump
          PG_RESTORE: docker exec -i ${{ job.services.postgres.id }} pg_restore
      - run: pnpm licenses:check
      - run: pnpm openapi:lint
      - run: pnpm api-client:check

  # The anchoring trial and the guest's browser tests need a browser; they run
  # apart from `pnpm check` so a Chromium download never blocks the fast
  # checks. The trial fails on a guessed must-not-match anchor (success
  # criterion 5); its results are uploaded, and the committed report under
  # packages/guest/trial/results is the record, reviewed like code. The
  # browser tests run the text-model fixtures through the guest, the RPC
  # against the fake sidebar, and the hostile-page check (criterion 6).
  guest-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @curanno/guest exec playwright install --with-deps chromium
      - run: pnpm --filter @curanno/guest test:browser
      - run: pnpm --filter @curanno/guest trial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-trial-results
          path: packages/guest/trial/results/

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @curanno/extension exec playwright install --with-deps chromium
      - run: pnpm --filter @curanno/extension test:browser

  # The sidebar's end-to-end test needs Postgres, Zitadel, the API and the
  # Vite dev server. Postgres and Zitadel come from compose.yaml, as they do
  # locally (the Zitadel proxy mounts its Caddyfile from the checkout, which
  # `services:` containers cannot); its provisioner writes the client id to
  # deploy/zitadel/.bootstrap/oidc.env, exported here for the live test.
  # Playwright starts the API and Vite.
  sidebar-e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://annotations:annotations@localhost:5432/annotations
      PUBLIC_URL: http://localhost:3000
      PORT: 3000
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      # Started first and waited for after the install, which it overlaps.
      - run: docker compose up -d
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @curanno/sidebar exec playwright install --with-deps chromium
      - name: Wait for the compose stack
        run: docker compose up -d --wait --wait-timeout 300 || (docker compose logs; exit 1)
      - run: pnpm --filter @curanno/api migrate
      - run: cat deploy/zitadel/.bootstrap/oidc.env >> "$GITHUB_ENV"
      - run: pnpm --filter @curanno/sidebar e2e
      # Discovery, the JWKS and a real token from this Zitadel, accepted by the API.
      - run: pnpm vitest run apps/api/src/auth/oidc-live.test.ts
        env:
          OIDC_LIVE_ISSUER: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sidebar-e2e-report
          path: |
            apps/sidebar/playwright-report/
            apps/sidebar/test-results/

  # The bookmarklet suite drives the built guest bundle, the built sidebar,
  # the built PDF viewer and an API answered by Playwright in Chromium: the
  # end-to-end tests over corpus pages and a corpus PDF (success criterion 1)
  # and the hostile-page test for the whole client (success criterion 6). It
  # needs neither Postgres nor Zitadel.
  bookmarklet-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @curanno/guest bundle
      - run: pnpm --filter @curanno/sidebar build
      - run: pnpm --filter @curanno/pdf-viewer build
      - run: pnpm --filter @curanno/sidebar exec playwright install --with-deps chromium
      - run: pnpm --filter @curanno/sidebar e2e:guest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bookmarklet-e2e-report
          path: |
            apps/sidebar/playwright-report/
            apps/sidebar/test-results/

  # The management site's end-to-end test needs the same stack as the sidebar's.
  web-e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://annotations:annotations@localhost:5432/annotations
      PUBLIC_URL: http://localhost:3000
      PORT: 3000
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      # Started first and waited for after the install, which it overlaps.
      - run: docker compose up -d
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @curanno/web exec playwright install --with-deps chromium
      - name: Wait for the compose stack
        run: docker compose up -d --wait --wait-timeout 300 || (docker compose logs; exit 1)
      - run: pnpm --filter @curanno/api migrate
      - run: cat deploy/zitadel/.bootstrap/oidc.env >> "$GITHUB_ENV"
      - run: pnpm --filter @curanno/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/

  # Both images must build and the chart must render without a cluster
  # (plan, Phase 3 and 5). Neither job pushes anything: publishing is the
  # operator's release step (docs/operator-guide.md).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --target api -t annotations-api -f Dockerfile .
      - run: docker build --target web -t annotations-web -f Dockerfile .
      - run: >-
          docker run --rm annotations-api node -e
          "const fs = require('node:fs'); for (const f of ['openapi.yaml', 'static/sidebar/index.html', 'static/pdf/index.html', 'static/guest.js', 'zitadel/provision.ts']) fs.accessSync(f); console.log('api image ok')"
      - run: docker run --rm annotations-web node -e "require('node:fs').accessSync('server/index.mjs'); console.log('web image ok')"
      # The site's CSP names the issuer it is started with, not the one it was built with.
      - run: >-
          docker run -d --rm -p 3001:3001
          -e NUXT_PUBLIC_OIDC_ISSUER=https://idp.ci.test
          annotations-web
      - run: node apps/web/scripts/check-runtime-csp.mjs http://localhost:3001 https://idp.ci.test

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/annotations --set secrets.databaseUrl=postgres://ci --set config.oidcClientId=ci
      - run: helm template ci deploy/helm/annotations --set secrets.databaseUrl=postgres://ci --set config.oidcClientId=ci --set ingress.enabled=true > /dev/null
      - run: helm template ci deploy/helm/annotations --set secrets.databaseUrl=postgres://ci --set zitadel.provision.enabled=true > /dev/null
      # The values for the official Zitadel chart (deploy/zitadel/README.md) must render.
      - run: helm repo add zitadel https://charts.zitadel.com
      - run: >-
          helm template zitadel zitadel/zitadel --version 10.4.0
          --skip-schema-validation -f deploy/zitadel/values.yaml > /dev/null
